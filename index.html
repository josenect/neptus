<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEPTUS STORE · Catálogo</title>
<meta name="description" content="Catálogo completo de NEPTUS STORE: camisas, camisetas, jeans, gorras, relojes, perfumes y más. Consulta disponibilidad por talla y pide por WhatsApp.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="NEPTUS STORE · Catálogo">
<meta property="og:description" content="Mira todo el catálogo y pide por WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:image" content="icon-512.png">
<!-- Arranca la descarga del catalogo a la vez que la del JS. Sin esto no empieza hasta que
     el JS se ha descargado y parseado, y hasta que llega no se pinta ni un producto. -->
<link rel="preload" href="catalog.json" as="fetch" crossorigin>
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body class="arrancando">

<!-- Lo primero que se ve: solo el logo sobre negro mientras llega el catalogo. Va aqui
     arriba del todo para que se pinte antes que nada. -->
<div class="cargando" id="cargando">
  <img src="logo.png" alt="NEPTUS" width="495" height="96">
</div>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="./" aria-label="Inicio">
      <!-- Logo real de la marca: PNG recortado y con fondo transparente, generado desde el
           original. Se sirve desde public/ para poder reemplazarlo sin tocar código. -->
      <img class="logo" src="logo.png" alt="NEPTUS" width="495" height="96">
      <small id="tagline"></small>
    </a>
    <a id="wa-header" class="wa-btn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.6 2 2.2 6.4 2.2 11.84c0 1.74.46 3.44 1.33 4.94L2 22l5.34-1.4a9.8 9.8 0 0 0 4.7 1.2h.01c5.43 0 9.84-4.4 9.84-9.84S17.47 2 12.04 2m0 17.98h-.01a8.2 8.2 0 0 1-4.16-1.14l-.3-.18-3.1.81.83-3.02-.2-.31a8.13 8.13 0 0 1-1.25-4.3c0-4.5 3.68-8.17 8.2-8.17a8.15 8.15 0 0 1 8.18 8.18c0 4.5-3.67 8.13-8.19 8.13m4.5-6.1c-.25-.12-1.46-.72-1.68-.8-.23-.09-.39-.13-.55.12s-.64.8-.78.97c-.15.16-.29.18-.53.06a6.7 6.7 0 0 1-1.97-1.21 7.4 7.4 0 0 1-1.37-1.7c-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.09-.16.05-.31-.02-.43-.06-.13-.55-1.33-.76-1.82-.2-.48-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3c-.22.25-.85.83-.85 2.02s.87 2.34 1 2.5c.12.17 1.71 2.61 4.15 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.45-.6 1.66-1.17.2-.58.2-1.07.14-1.18s-.22-.17-.46-.29"/></svg>
      <span>WhatsApp</span>
    </a>
  </div>
</header>

<div class="filters" id="filters">
  <div class="wrap">

    <div class="search-row">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39 1.42-1.42-5.39-5.39A8 8 0 0 0 10 2m0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12"/></svg>
        <input id="q" type="search" placeholder="Buscar referencia (ej. CAM-0142)" autocomplete="off" aria-label="Buscar por referencia">
      </div>
      <!-- Solo en movil: abre el panel de filtros. En escritorio los chips ya estan a la vista. -->
      <button id="open-filters" class="filters-btn" type="button" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3zm4 6h10v2H7zm3 6h4v2h-4z"/></svg>
        <span>Filtros</span>
        <span class="fbadge" id="fbadge" hidden></span>
      </button>
      <button id="reset" class="reset" type="button" hidden>Limpiar filtros</button>
    </div>

    <!-- Solo escritorio: ahí hay ancho de sobra para tener los chips a la vista. En móvil
         esta fila no existe y los filtros viven únicamente en el panel, para que no aparezcan
         dos veces ni haya dos sitios donde tocar lo mismo. -->
    <div class="rows">
      <div class="chip-block">
        <span class="chip-label">Categoría</span>
        <div class="chips-wrap">
          <div class="chips" id="cats"></div>
          <button class="chips-nav prev" type="button" aria-label="Ver categorías anteriores">&#8249;</button>
          <button class="chips-nav next" type="button" aria-label="Ver más categorías">&#8250;</button>
        </div>
      </div>

      <div class="chip-block" id="brand-block" hidden>
        <span class="chip-label">Marca</span>
        <div class="chips-wrap">
          <div class="chips" id="brands"></div>
          <button class="chips-nav prev" type="button" aria-label="Ver marcas anteriores">&#8249;</button>
          <button class="chips-nav next" type="button" aria-label="Ver más marcas">&#8250;</button>
        </div>
      </div>

      <div class="chip-block" id="size-block">
        <span class="chip-label">Talla</span>
        <div class="chips-wrap">
          <div class="chips" id="sizes"></div>
          <button class="chips-nav prev" type="button" aria-label="Ver tallas anteriores">&#8249;</button>
          <button class="chips-nav next" type="button" aria-label="Ver más tallas">&#8250;</button>
        </div>
      </div>
    </div>

    <!-- Filtros activos, para verlos y quitarlos de un toque. -->
    <div class="pills" id="pills" hidden></div>

  </div>

</div>

<div class="scrim" id="scrim" hidden></div>

<div class="panel" id="panel">
  <div class="wrap">

    <div class="panel-head">
      <strong>Filtros</strong>
      <button class="panel-x" id="close-filters" type="button" aria-label="Cerrar">&times;</button>
    </div>

    <!-- Copia del mismo juego de filtros, aquí sin recortar: todo en varias líneas. -->
    <div class="chip-block">
      <span class="chip-label">Categoría</span>
      <div class="chips" id="cats-p"></div>
    </div>

    <div class="chip-block" id="brand-block-p" hidden>
      <span class="chip-label">Marca</span>
      <div class="chips" id="brands-p"></div>
    </div>

    <div class="chip-block" id="size-block-p">
      <span class="chip-label">Talla</span>
      <div class="chips" id="sizes-p"></div>
    </div>

    <div class="panel-foot">
      <button class="panel-clear" id="panel-clear" type="button">Limpiar</button>
      <button class="panel-apply" id="panel-apply" type="button">Ver <span id="apply-n"></span></button>
    </div>

  </div>
</div>

<!-- Selector de bienvenida: solo la primera visita, y nunca si el enlace ya trae categoria.
     Mientras esta abierto no se descarga ninguna foto de producto. -->
<div class="bien-fondo" id="bienvenida" hidden>
  <div class="bien" role="dialog" aria-modal="true" aria-labelledby="bien-titulo">
    <div class="bien-top">
      <img class="bien-logo" src="logo.png" alt="NEPTUS" width="495" height="96">
      <p class="bien-hola" id="bien-hola"></p>
    </div>
    <div class="bien-in">
      <h2 class="bien-titulo" id="bien-titulo">¿Qué quieres ver?</h2>
      <div class="bien-grid" id="bien-grid"></div>
    </div>
    <div class="bien-foot">
      <button class="bien-todo" id="bien-todo" type="button">
        Ver todo el catálogo <span id="bien-total"></span>
      </button>
    </div>
  </div>
</div>

<main class="wrap">
  <p class="count" id="count" role="status" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden><span id="empty-msg">No hay productos con esos filtros.</span><br><button type="button" class="linklike" id="empty-reset">Ver todo el catálogo</button></p>
  <nav class="pager" id="pager" aria-label="Paginación"></nav>
</main>

<footer class="foot">
  <div class="wrap">
    <p id="foot-store">NEPTUS STORE</p>
    <p class="muted" id="foot-meta"></p>
  </div>
</footer>

<dialog id="lb" class="lb" aria-label="Detalle del producto">
  <button class="lb-x" id="lb-x" type="button" aria-label="Cerrar">&times;</button>
  <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="Anterior">&#8249;</button>
  <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="Siguiente">&#8250;</button>
  <div class="lb-in">
    <div class="lb-img"><img id="lb-img" alt=""></div>
    <div class="lb-info">
      <p class="lb-cat" id="lb-cat"></p>
      <h2 class="lb-ref" id="lb-ref"></h2>
      <div id="lb-sizes-wrap" hidden>
        <p class="lb-lbl">Tallas disponibles</p>
        <div class="lb-sizes" id="lb-sizes"></div>
      </div>
      <a id="lb-wa" class="wa-btn wa-big" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.6 2 2.2 6.4 2.2 11.84c0 1.74.46 3.44 1.33 4.94L2 22l5.34-1.4a9.8 9.8 0 0 0 4.7 1.2h.01c5.43 0 9.84-4.4 9.84-9.84S17.47 2 12.04 2m4.5 11.88c-.25-.12-1.46-.72-1.68-.8-.23-.09-.39-.13-.55.12s-.64.8-.78.97c-.15.16-.29.18-.53.06a6.7 6.7 0 0 1-1.97-1.21 7.4 7.4 0 0 1-1.37-1.7c-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.09-.16.05-.31-.02-.43-.06-.13-.55-1.33-.76-1.82-.2-.48-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3c-.22.25-.85.83-.85 2.02s.87 2.34 1 2.5c.12.17 1.71 2.61 4.15 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.45-.6 1.66-1.17.2-.58.2-1.07.14-1.18s-.22-.17-.46-.29"/></svg>
        <span>Pedir por WhatsApp</span>
      </a>
      <p class="lb-hint">Se abre WhatsApp con el mensaje ya escrito.</p>
    </div>
  </div>
</dialog>

<!-- config.js vive en public/ y se copia tal cual: se puede editar despues de compilar
     (cambiar el WhatsApp no obliga a volver a construir el sitio). -->
<script src="/config.js"></script>
<script type="module" src="/src/app.js"></script>
</body>
</html>
